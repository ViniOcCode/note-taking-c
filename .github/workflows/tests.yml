name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install meson
      - run: meson setup builddir
      - run: meson compile -C builddir
      - run: meson test -C builddir --print-errorlogs
